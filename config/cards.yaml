# Card registry: one entry per card. Our id, the bank, how each aggregator names it, and where the
# official T&Cs live. `official.product_page` is scanned for T&C PDFs (patterns in sources.yaml);
# `official.tnc_urls` lists documents explicitly. Add cards with `pocketaces discover --write`.
cards:
- id: amex-krisflyer
  bank: American Express
  bank_key: amex
  name: American Express Singapore Airlines KrisFlyer Credit Card
  sources:
    singsaver: american-express-singapore-airlines-krisflyer-credit-card
    moneysmart: american-express-singapore-airlines-krisflyer-credit-card
  official:
    product_page: https://www.americanexpress.com/sg/credit-cards/singapore-airlines-krisflyer-credit-card/
    tnc_urls:
    - https://www.americanexpress.com/content/dam/amex/sg/campaigns/pdfs/krisflyer-credit-card.pdf
    - https://www.americanexpress.com/content/dam/amex/sg/benefits/amex-sg-exclusions.pdf
    notes: First PDF is a combined 'Card Member Agreement and Benefits Terms and Conditions' document;
      only its 'Benefits Terms and Conditions' section (earning KrisFlyer miles, bonus miles) is the relevant
      rewards T&C, the rest is the generic cardmember agreement (kept as one file since Amex publishes
      them together, not separable by URL). Second PDF is Amex's general non-eligible-purchases/MCC-style
      exclusion list, which this card's earn rules explicitly reference (go.amex/sgexclusions redirects
      to it) and which also covers Membership Rewards cards, the True Cashback card, and the SIA Business
      card. Both verified 200/application-pdf.
