notes:
- 'Loyalty bonus: UNI$10,000 (20,000 miles) for S$80,000 spend in a membership year (cards approved from
  1 Aug 2026; existing cards from the first membership-year statement on/after 1 Oct 2026 — previously S$50,000).
  Annual fee waived at S$50,000 spend.'
- 'From 1 Jul 2026: 5,000 bonus miles (UNI$2,500) for S$8,000 in-person overseas spend per calendar quarter
  (principal + supplementary; online/card-not-present excluded).'
- 4 complimentary Priority Pass lounge visits per calendar year (principal only).
- FCY fee 3.25%; 1% fee on SGD transactions processed overseas (Visa/Mastercard).
