notes:
- 'Formerly the Trust Cashback Card (relaunched Aug 2026). Four reward modes, switchable each membership quarter.
  This record models Miles mode. Other modes: Unlimited Cashback 1.5% SGD / 0.5% FCY; Stockback 3% on SGD and
  FCY until 31 Dec 2026, then 2% SGD / 0.5% FCY, capped at S$500 stockback per quarter; Bonus Cashback 5% (min.
  S$500/month, cap S$30/quarter) or 15% (min. S$2,000/month, cap S$250/quarter) on one chosen category, 1% other
  SGD / 0.5% FCY'
